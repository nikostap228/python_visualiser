<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сортировка вставками</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>🔤 Сортировка вставками (Insertion Sort)</h1>
   
    <div id="controls">
        <label>Введите числа (через запятую):</label><br>
        <input type="text" id="input" value="64,34,25,12,22,11,90,5">
        <button onclick="startSort()">▶️ Запустить Insertion Sort</button>
        <button onclick="prevStep()" id="prevBtn" disabled>⬅️ Назад</button>
        <button onclick="nextStep()">➡️ Шаг</button>
    </div>
   
    <canvas id="canvas" width="900" height="450"></canvas>
   
    <div id="info">Шаг: <span id="step">0</span> / <span id="total">0</span></div>
   
    <pre id="code">for i in range(1, len(arr)):
    key = arr[i]
    j = i - 1
    while j >= 0 and arr[j] > key:  # ← Сдвиг больших элементов
        arr[j + 1] = arr[j]
        j -= 1
    arr[j + 1] = key  # ← Вставка key</pre>

    <meta name="csrf-token" content="{{ csrf_token }}">

    <script>
        let steps = []; let currentStep = 0;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        }
        
        async function startSort() {
            const nums = document.getElementById('input').value.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
            if (nums.length < 2) return alert('Введите минимум 2 числа!');
            
            const res = await fetch('/insertion_sort/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({numbers: nums})
            });
            
            const data = await res.json();
            steps = data.steps;
            currentStep = 0;
            document.getElementById('total').textContent = steps.length;
            document.getElementById('prevBtn').disabled = true;
            nextStep();
        }
        
        function nextStep() {
            if (currentStep >= steps.length) return;
            const step = steps[currentStep];
            drawArray(step.array, step);
            document.getElementById('step').textContent = currentStep + 1;
            document.getElementById('prevBtn').disabled = currentStep === 0;
            currentStep++;
        }
        
        function prevStep() {
            if (currentStep <= 0) return;
            currentStep--;
            const step = steps[currentStep];
            drawArray(step.array, step);
            document.getElementById('step').textContent = currentStep + 1;
            document.getElementById('prevBtn').disabled = currentStep === 0;
        }
        
        function drawArray(arr, info) {
            ctx.clearRect(0, 0, 900, 450);
            const max = Math.max(...arr);
            const w = 900 / arr.length;
            for (let i = 0; i < arr.length; i++) {
                let color = `hsl(${arr[i] / max * 360}, 70%, 50%)`;
                if (i === info.i) color = '#ff4444';  // текущий элемент
                else if (info.j !== undefined && i === info.j) color = '#ffaa00';  // сдвигаемый
                ctx.fillStyle = color;
                ctx.fillRect(i * w, 450 - (arr[i] / max * 400), w - 2, arr[i] / max * 400);
                ctx.fillStyle = '#000';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(arr[i], i * w + w / 2, 440);
            }
        }
        
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') nextStep();
            if (e.key === 'ArrowLeft') prevStep();
        });
    </script>
</body>
</html>
